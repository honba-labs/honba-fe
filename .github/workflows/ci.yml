name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: honba-fe/package-lock.json

      - name: Install dependencies
        working-directory: honba-fe
        run: npm ci

      - name: Typecheck
        working-directory: honba-fe
        run: npm run typecheck || npx tsc --noEmit

      - name: Lint
        working-directory: honba-fe
        run: npm run lint

      - name: Run Tests
        working-directory: honba-fe
        run: npm test

      - name: Build
        working-directory: honba-fe
        run: npm run build
